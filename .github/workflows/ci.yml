name: Rust checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo run --locked -p ores-analyze -- examples/hard-realtime.json hard
      - name: Verify cross-repo scalar v1 fixture (model-only)
        run: |
          cargo run --locked -p ores-analyze -- examples/rust-scalar-expected.json hard > target/rust-scalar-report.json
          python3 -c 'import json,hashlib; from pathlib import Path; ir=Path("examples/rust-scalar-expected.json").read_text().strip(); assert hashlib.sha256(ir.encode()).hexdigest()=="8ee1adbf6faef704c1eb6d2b2075c3b2d723097037f646f9e6e518a69d005463"; r=json.loads(Path("target/rust-scalar-report.json").read_text()); assert r["assurance_level"]=="untrusted_effect_ir_model_only"; assert r["functions"]["answer"]["allocations_upper_bound"]==0; assert r["functions"]["answer"]["copies_upper_bound"]==0; assert r["functions"]["answer"]["operations_upper_bound"]==3'
      - name: Reject unsafe program
        run: |
          if cargo run --locked -p ores-analyze -- examples/unsafe.json hard; then
            echo "Expected hard real-time profile to reject unsafe program"
            exit 1
          fi
