name: Rust checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -p ores-analyze -- examples/hard-realtime.json hard
      - name: Reject unsafe program
        run: |
          if cargo run -p ores-analyze -- examples/unsafe.json hard; then
            echo "Expected hard real-time profile to reject unsafe program"
            exit 1
          fi
